services:
  - type: web
    name: reliefgrid
    runtime: python
    plan: starter
    rootDir: projects/reliefgrid
    buildCommand: python -m unittest discover -s tests -v
    startCommand: python app.py
    healthCheckPath: /api/health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: RELIEFGRID_DB
        value: /var/data/reliefgrid.db
    disk:
      name: reliefgrid-data
      mountPath: /var/data
      sizeGB: 1
